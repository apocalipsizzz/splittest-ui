# pnpm 11 хранит свои настройки здесь, а не в package.json.
#
# По умолчанию pnpm блокирует postinstall-скрипты зависимостей — это защита от
# supply-chain атак. Явно разрешаем их только тем пакетам, которым они нужны
# для распаковки нативных бинарников.
allowBuilds:
  '@parcel/watcher': true
  'esbuild': true
